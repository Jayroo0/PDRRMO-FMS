<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDRRMO FMS | Secure Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Corporate Command Center Layout Engine */
        :root {
            --brand-blue: #0f172a;       /* Corporate Slate Navy */
            --brand-orange: #ea580c;     /* Alert Orange Accent */
            --brand-bg: #f1f5f9;         /* Clean Executive Gray Canvas */
            --text-main: #0f172a;        /* High-Definition Slate Text */
            --pdrrmo-blue-accent: #0076c0; /* Blue taken from PDRRMO logo hands */
        }

        /* MINIMALIST MONOCHROME OVERRIDE */
        body { 
            background-color: #ffffff; 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }

        .login-card { 
            border: 2px solid var(--brand-blue);
            background-color: #ffffff; 
            border-radius: 0px; /* Sharp corporate architectural edges */
            padding: 45px; 
            width: 100%;
            max-width: 440px;
        }

        /* Stark Command Center Alert Banner with smooth transition support */
        .alert-command {
            background-color: #ffffff;
            border: 2px solid var(--brand-orange);
            color: var(--brand-orange);
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: 0px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: opacity 0.5s ease-out;
        }

        /* Standardized Form Inputs with High-Contrast Sharp Outlines */
        .form-control {
            background-color: #ffffff;
            border: 2px solid var(--brand-blue);
            color: var(--text-main);
            padding: 14px;
            font-size: 0.95rem;
            border-radius: 0px;
            font-weight: 500;
        }
        .form-control::placeholder {
            color: #94a3b8;
        }
        .form-control:focus {
            background-color: #ffffff;
            border-color: var(--pdrrmo-blue-accent);
            color: var(--text-main);
            box-shadow: none; /* No glow, keeping design stark and intentional */
        }

        /* Executive Command Button - Solid Stark Slab */
        .btn-command { 
            background-color: var(--brand-blue); 
            color: #ffffff; 
            border: 2px solid var(--brand-blue); 
            font-weight: 700; 
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 16px;
            border-radius: 0px;
            transition: all 0.1s ease-in-out;
        }
        .btn-command:hover { 
            background-color: #ffffff;
            color: var(--brand-blue);
        }

        /* Secondary Public Hub Action - Outline Slab */
        .btn-public-hub {
            border: 2px solid #cbd5e1;
            color: #64748b;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
            padding: 14px;
            background-color: #ffffff;
            border-radius: 0px;
            transition: all 0.1s ease-in-out;
            text-decoration: none;
            display: block;
        }
        .btn-public-hub:hover {
            background-color: #f8fafc;
            color: var(--text-main);
            border-color: var(--brand-blue);
        }

        .system-title {
            color: var(--brand-blue);
            font-weight: 900;
            letter-spacing: -0.03em;
            font-size: 1.75rem;
            line-height: 1.1;
        }

        .system-index {
            font-family: ui-monospace, monospace;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--brand-blue);
            letter-spacing: 1px;
        }

    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

    <div class="login-card">

        <div class="pb-3 mb-4 text-start">
            <div class="system-index text-uppercase mb-2">SYS.REF // FLT-CTRL-04</div>
            <h1 class="system-title m-0">FLEET CONTROL CENTER</h1>
            <p class="text-uppercase text-muted fw-bold small m-0 mt-2" style="letter-spacing: 1.5px; font-size: 0.7rem;">Verified Identity Credentials Required</p>
        </div>
        
        {% if messages %}
            <div class="messages mb-4" id="alert-container">
                {% for message in messages %}
                    <div class="alert alert-command p-3 fade show d-flex align-items-center" role="alert">
                        <span class="me-2">⚠️</span>
                        <div>{{ message }}</div>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        
        <form method="post" action="{% url 'dashboard_portal:login' %}">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label text-dark small fw-bold text-uppercase mb-2" style="font-size: 0.7rem; letter-spacing: 1px;">01. Personnel Identifier</label>
                <input type="text" name="username" class="form-control" placeholder="OPERATOR ID" required autofocus>
            </div>
            
            <div class="mb-4">
                <label class="form-label text-dark small fw-bold text-uppercase mb-2" style="font-size: 0.7rem; letter-spacing: 1px;">02. Access Cryptograph</label>
                <input type="password" name="password" class="form-control" placeholder="PASSWORD KEY" required>
            </div>
            
            <div class="d-grid gap-2 pt-2">
                <button type="submit" class="btn btn-command">Authenticate</button>
                <a href="{% url 'dashboard_portal:homepage' %}" class="btn-public-hub text-center">
                    Exit Gateway Portal
                </a>
            </div>
        </form>

        <div class="text-start mt-5 pt-3 border-top border-dark text-muted fw-medium" style="font-size: 0.65rem; letter-spacing: 0.5px; line-height: 1.5;">
            OWNER: PROVINCIAL DRRM OFFICE, PALAWAN<br>
            CLASSIFICATION: INTERNAL MANAGEMENT PLATFORM
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const alertContainer = document.getElementById("alert-container");
            if (alertContainer) {
                setTimeout(function() {
                    // Triggers Bootstrap smooth fade-out
                    const alerts = alertContainer.querySelectorAll('.alert');
                    alerts.forEach(alert => {
                        alert.classList.remove('show');
                        alert.style.opacity = '0';
                    });
                    
                    // Entirely removes element container from DOM structure after transition wraps up
                    setTimeout(() => { alertContainer.remove(); }, 500);
                }, 3000); // 3000 milliseconds = 3 seconds
            }
        });
    </script>
</body>
</html>
