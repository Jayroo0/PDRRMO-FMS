<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>PDRRMO Fleet Portal Login</title>
</head>
<body style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); min-height: 100vh;" class="d-flex align-items-center justify-content-center">
    
    <div class="card border-0 shadow-lg p-4 rounded-4 text-center" style="max-width: 440px; width: 100%; background-color: #ffffff;">
        
        <div class="mb-4 mt-2">
            <img src="https://img.icons8.com/color/96/shield.png" alt="PDRRMO Shield" class="mb-2" style="max-height: 80px;">
            <h2 class="fw-bold text-dark tracking-tight mb-1" style="font-size: 1.75rem;">PDRRMO FLEET</h2>
            <p class="text-muted small text-uppercase tracking-wider fw-semibold" style="font-size: 0.75rem;">Emergency Response Operations Portal</p>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger border-0 rounded-3 text-start d-flex align-items-center gap-2 py-2 px-3 mb-3 small" role="alert">
                <i class="fa-solid fa-triangle-exclamation text-danger fs-5"></i>
                <span class="fw-medium">Invalid credentials. Please verify your tokens.</span>
            </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}" autocomplete="off">
            {% csrf_token %}
            
            <div class="mb-3 text-start">
                <label class="form-label text-secondary small fw-bold text-uppercase" style="font-size: 0.725rem;">Operator Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted" style="width: 46px; justify-content: center;">
                        <i class="fa-solid fa-user-shield"></i>
                    </span>
                    <input type="text" name="username" class="form-control" placeholder="Enter operator username" required autofocus>
                </div>
            </div>

            <div class="mb-4 text-start">
                <label class="form-label text-secondary small fw-bold text-uppercase" style="font-size: 0.725rem;">Authorization Key</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted" style="width: 46px; justify-content: center;">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <div class="mb-2">
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2.5 rounded-3 shadow-sm border-0" style="background-color: #2563eb;">
                    <i class="fa-solid fa-right-to-bracket me-1"></i> INITIALIZE SESSION
                </button>
            </div>
        </form>

        <div class="mt-3 border-top pt-3">
            <a href="/" class="back-link">
    <i class="fa-solid fa-arrow-left"></i> Back to Fleet View
</a>
        </div>
    </div>

</body>
</html>
